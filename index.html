:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "GenSenRounded TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 28px;
  padding-bottom: 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
  gap:20px;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

/* ---------- start ---------- */
#start{
  margin:auto 0; text-align:center;
  position:relative; overflow:hidden;
  padding:40px 28px 32px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 30px 70px -36px rgba(33,31,28,0.18);
}
.night-deco{ position:absolute; inset:0; pointer-events:none; z-index:0; }
.night-moon{
  position:absolute; top:24px; right:26px;
  width:28px; height:28px; color:#f3e3c2; opacity:0.92;
  filter:drop-shadow(0 0 14px rgba(243,227,194,0.5));
}
.night-star{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:#f3efe6; opacity:0.55;
  box-shadow:0 0 6px 1px rgba(243,239,230,0.55);
}
@media (prefers-reduced-motion:no-preference){
  .night-star{ animation: twinkle 3.6s ease-in-out infinite; }
  .night-star:nth-child(3){ animation-delay:0.6s; }
  .night-star:nth-child(4){ animation-delay:1.2s; }
  .night-star:nth-child(5){ animation-delay:1.8s; }
  .night-star:nth-child(6){ animation-delay:2.4s; }
  @keyframes twinkle{ 0%,100%{opacity:0.22;} 50%{opacity:0.85;} }
}
#start > *{ position:relative; z-index:1; }
#start .eyebrow{ color:var(--accent); }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(32px, 7.8vw, 44px);
  line-height:1.25; margin:12px 0 14px;
  text-wrap:balance; color:var(--ink);
}
#start p.lede{
  font-size:16.5px; line-height:1.7; color:var(--ink-soft);
  margin:0 auto 26px; max-width:44ch;
}
.type-chips{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin-bottom:26px;
}
.type-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14.5px; font-weight:600;
  background:var(--accent-soft); border:1px solid var(--line);
  color:var(--ink);
  border-radius:999px; padding:8px 16px 8px 12px;
}
.type-chip svg{ width:15px; height:15px; color:var(--accent); flex:none; }
.btn-primary{
  font-family:var(--body); font-weight:700; font-size:18.5px;
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
}
#start .btn-primary, #quiz .btn-primary, #result .btn-primary{ color:#fff; background:var(--ink); }
:root[data-theme="dark"] #start .btn-primary,
:root[data-theme="dark"] #quiz .btn-primary,
:root[data-theme="dark"] #result .btn-primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #start .btn-primary,
  :root:not([data-theme="light"]) #quiz .btn-primary,
  :root:not([data-theme="light"]) #result .btn-primary{ color:var(--bg); }
}
.btn-primary:active{ transform:scale(0.98); }
#start .meta{
  margin-top:14px; font-size:14px; color:var(--ink-soft);
}

/* ---------- quiz ---------- */
#quiz{
  flex:1; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  padding:22px 24px 26px;
  border-radius:28px;
  color:var(--ink);
  background:rgba(255,255,255,0.6);
  border:1px solid var(--line);
  box-shadow:0 26px 60px -32px rgba(33,31,28,0.16);
}
.quiz-deco{ position:absolute; inset:0; pointer-events:none; z-index:0; }
.quiz-deco .night-moon{ top:60px; right:22px; width:20px; height:20px; opacity:0.75; }
.quiz-deco .night-star{ width:2.5px; height:2.5px; }
#quiz > *{ position:relative; z-index:1; }
.rail{
  display:flex; align-items:center; gap:14px;
  margin-bottom:22px;
}
.back-btn{
  flex:none; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface-2);
  color:var(--ink); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.back-btn svg{ width:18px; height:18px; }
.back-btn:active{ transform:scale(0.95); }
.rail-track{
  flex:1; height:6px; border-radius:4px;
  background:var(--line); overflow:hidden;
}
.rail-fill{
  height:100%; border-radius:4px;
  background:var(--accent);
  transition:width .35s ease;
}
.rail-count{
  font-variant-numeric:tabular-nums;
  font-size:14.5px; font-weight:700; color:var(--ink-soft);
  white-space:nowrap;
}
.q-title{
  font-family:var(--display); font-weight:700;
  font-size:clamp(21px,5.2vw,26px); line-height:1.45;
  margin:0 0 18px; color:var(--ink);
  text-wrap:balance;
}
.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  text-align:left;
  font-family:var(--body); font-size:16px; line-height:1.5; color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--line); border-radius:14px;
  padding:14px 18px; cursor:pointer;
  box-shadow:0 10px 24px -20px rgba(33,31,28,0.3);
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:hover{ border-color:var(--accent); }
.option:active{ transform:scale(0.99); }

/* ---------- result ---------- */
.hero-icon-circle{
  width:72px; height:72px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
}
.hero-icon-circle svg{ width:34px; height:34px; }
#result{ text-align:center; }
#result h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(28px,7.6vw,38px); line-height:1.25;
  margin:0 0 10px; text-wrap:balance;
}
#result .tagline{
  font-size:16.5px; color:var(--accent); font-weight:700;
  margin:0 0 18px;
}
#result .desc{
  font-size:16.5px; line-height:1.75; color:var(--ink-soft);
  margin:0 auto 14px; max-width:48ch; text-align:left;
}
.coord-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:22px 20px; margin:22px 0;
  text-align:left;
}
.coord-card h2{
  font-family:var(--body); font-weight:700; font-size:13.5px;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 16px;
}
.coord-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.coord-row:last-child{ margin-bottom:0; }
.coord-labels{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); }
.coord-track{ height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.coord-fill{ height:100%; border-radius:4px; background:var(--accent); transition:width .5s ease; }
.coord-score{
  text-align:right; margin-top:2px;
  font-size:13.5px; color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
}
.coord-score b{ color:var(--accent); font-size:15px; }

.result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
.btn-ghost{
  font-family:var(--body); font-weight:700; font-size:16px;
  color:var(--ink); background:transparent;
  border:1.5px solid var(--line); border-radius:14px;
  padding:13px 22px; cursor:pointer;
}
.btn-ghost:active{ transform:scale(0.98); }
.copied{ font-size:14.5px; color:var(--ink-soft); margin-top:10px; height:16px; text-align:center; }

footer{
  text-align:center; font-size:14px; color:var(--ink-soft);
  margin-top:12px;
}
.sponsor-link{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:14px; font-size:14px; font-weight:600;
  color:var(--accent); text-decoration:none;
}
.sponsor-link:hover{ text-decoration:underline; }
</style>

/* coordinate system: x = 主動程度 0-10, y = 濃烈張力 0-10 */

var current = 0;
var answers = []; // { x, y } per question, index-aligned with QUESTIONS
var shuffledOrders = []; // remembers shuffle per question for back-navigation

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* ---------------- render: start ---------------- */
var chipsEl = document.getElementById("type-chips");

  var t = TYPES[key];
  chipsEl.insertAdjacentHTML("beforeend",
    '<span class="type-chip">'+iconSvg(key,15)+t.name+'</span>');
});

document.getElementById("start-btn").addEventListener("click", function(){
  logEvent("start");
  document.getElementById("start").hidden = true;
  document.getElementById("quiz").hidden = false;
  renderQuestion();
});

/* ---------------- render: quiz ---------------- */

var qTitle = document.getElementById("q-title");
var qOptions = document.getElementById("q-options");
var backBtn = document.getElementById("back-btn");

backBtn.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

function renderQuestion(){
  var total = QUESTIONS.length;
  railFill.style.width = (current/total*100)+"%";
  railCount.textContent = (current+1)+" / "+total;
  backBtn.style.visibility = current===0 ? "hidden" : "visible";

  var item = QUESTIONS[current];
  qTitle.textContent = item.q;
  qOptions.innerHTML = "";

  var order = shuffledOrders[current];
  if(!order){
    order = shuffle(ORDER);
    shuffledOrders[current] = order;
  }

  order.forEach(function(key){
    var btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.textContent = item.opts[key];
    btn.addEventListener("click", function(){
      answers[current] = { x: TYPES[key].x, y: TYPES[key].y, key: key };
      if(current < QUESTIONS.length - 1){
        current++;
        renderQuestion();
      } else {
        showResult();
      }
    });
    qOptions.appendChild(btn);
  });
}

/* ---------------- result ----------------
   Primary rule: whichever type's voice you picked most often wins —
   simple, transparent, and matches how people expect the result to be
   decided. Ties (rare with 13 questions across 7 types) are broken by
   whichever type sits closest to your average initiative/intensity
   coordinate. (An earlier version picked purely by nearest coordinate,
   but that let one type's position dominate almost every mixed answer
   pattern — this fixes that.) */
function showResult(){
  var counts = {}; ORDER.forEach(function(k){ counts[k] = 0; });
  var sumX=0, sumY=0, n=0;
  answers.forEach(function(a){
    if(a){ sumX+=a.x; sumY+=a.y; n++; counts[a.key]++; }
  });
  var avgX = n ? sumX/n : 5;
  var avgY = n ? sumY/n : 5;

  var bestKey = ORDER[0], bestCount = -1, bestDist = Infinity;
  ORDER.forEach(function(key){
    var t = TYPES[key];
    var c = counts[key];
    var d = Math.pow(t.x-avgX,2) + Math.pow(t.y-avgY,2);
    if(c > bestCount || (c === bestCount && d < bestDist)){
      bestCount = c; bestDist = d; bestKey = key;
    }
  });

  var t = TYPES[bestKey];
  document.getElementById("hero-icon").innerHTML = iconSvg(bestKey, 40);
  document.getElementById("r-name").textContent = t.name;
  document.getElementById("r-tagline").textContent = t.tagline;
  document.getElementById("r-desc").textContent = t.desc;
  document.getElementById("bar-x").style.width = (avgX/10*100)+"%";
  document.getElementById("bar-y").style.width = (avgY/10*100)+"%";
  document.getElementById("val-x").textContent = avgX.toFixed(1);
  document.getElementById("val-y").textContent = avgY.toFixed(1);

  document.getElementById("quiz").hidden = true;
  document.getElementById("result").hidden = false;

  logEvent("complete", bestKey);
}

document.getElementById("retake-btn").addEventListener("click", function(){
  current = 0;
  answers = [];
  shuffledOrders = [];
  document.getElementById("result").hidden = true;
  document.getElementById("start").hidden = false;
});

document.getElementById("copy-url-btn").addEventListener("click", function(){
  var msg = document.getElementById("url-msg");
  navigator.clipboard.writeText(location.href).then(function(){
    msg.textContent = "網址已複製";
    setTimeout(function(){ msg.textContent = ""; }, 2000);
  }).catch(function(){
    msg.textContent = "複製失敗，請手動複製網址";
  });
});

})();
</script>
